name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            src/frontend/pnpm-lock.yaml
            src/backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile

      - name: Create client env file
        run: |
          echo "VITE_KONG_BASE_URL=http://localhost:3000" > src/frontend/.env

      - name: Create backend env file
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/food_recipes_test" > src/backend/apps/api/.env
          printf 'JWT_SECRET=%s\n' "$(openssl rand -base64 48)" >> src/backend/apps/api/.env

      - name: Typecheck client
        working-directory: src/frontend
        run: pnpm exec tsc --noEmit
        continue-on-error: true
