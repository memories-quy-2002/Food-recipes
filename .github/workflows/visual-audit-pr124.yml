name: Manual visual audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL to audit, without a trailing slash
        required: true
        type: string
      entry_url:
        description: Optional authenticated or shared entry URL
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture responsive screenshots and migration inventory
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
          ENTRY_URL: ${{ inputs.entry_url }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const path = require('node:path');

          const baseUrl = process.env.BASE_URL;
          const entryUrl = process.env.ENTRY_URL || baseUrl;
          const outputDir = path.join('public', 'visual-audit-pr124');
          const viewports = [
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'desktop-1080', width: 1920, height: 1080 },
            { name: 'desktop-1440', width: 2560, height: 1440 },
          ];
          const routes = [
            { name: 'home', path: '/' },
            { name: 'account-login', path: '/account?signup=false' },
            { name: 'account-signup', path: '/account?signup=true' },
            { name: 'food', path: '/food' },
          ];

          fs.rmSync(outputDir, { recursive: true, force: true });
          fs.mkdirSync(outputDir, { recursive: true });

          const scanExtensions = new Set(['.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html']);
          const migration = { legacyUiImports: [], styleImports: [], bootstrapReferences: [] };
          function scan(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', 'dist', 'public', '.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { scan(full); continue; }
              if (!scanExtensions.has(path.extname(entry.name))) continue;
              const source = fs.readFileSync(full, 'utf8');
              const relative = path.relative(process.cwd(), full);
              if (source.includes('@/shared/ui/legacy-ui')) migration.legacyUiImports.push(relative);
              if (/import\s+["'][^"']+\.(?:scss|css)["']/.test(source) && relative !== 'app/index.css') migration.styleImports.push(relative);
              if (/bootstrap/i.test(source) && !relative.includes('no-bootstrap.test')) migration.bootstrapReferences.push(relative);
            }
          }
          scan(process.cwd());
          fs.writeFileSync(path.join(outputDir, 'migration-inventory.json'), JSON.stringify(migration, null, 2));

          const report = [];
          let browser;
          try {
            browser = await chromium.launch();
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (msg) => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
              page.on('pageerror', (err) => pageErrors.push(err.message));

              try {
                await page.goto(entryUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(1500);
              } catch (error) {
                report.push({ route: 'preview-auth', viewport: viewport.name, error: String(error) });
              }

              for (const route of routes) {
                try {
                  const response = await page.goto(`${baseUrl}${route.path}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await page.waitForTimeout(2500);
                  const file = `${route.name}-${viewport.name}.png`;
                  await page.screenshot({ path: path.join(outputDir, file), fullPage: true });
                  report.push({
                    route: route.name,
                    viewport: viewport.name,
                    url: page.url(),
                    status: response?.status(),
                    title: await page.title(),
                    bodyText: (await page.locator('body').innerText()).slice(0, 5000),
                    consoleErrors: [...consoleErrors],
                    pageErrors: [...pageErrors],
                    horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth),
                  });
                } catch (error) {
                  report.push({ route: route.name, viewport: viewport.name, error: String(error), url: page.url() });
                }
                consoleErrors.length = 0;
                pageErrors.length = 0;
              }

              try {
                await page.goto(`${baseUrl}/food`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(2500);
                const recipeHref = await page.locator('a[href*="/recipe?id="]').first().getAttribute('href').catch(() => null);
                if (recipeHref) {
                  const response = await page.goto(new URL(recipeHref, baseUrl).toString(), { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await page.waitForTimeout(2500);
                  const file = `recipe-${viewport.name}.png`;
                  await page.screenshot({ path: path.join(outputDir, file), fullPage: true });
                  report.push({
                    route: 'recipe',
                    viewport: viewport.name,
                    url: page.url(),
                    status: response?.status(),
                    title: await page.title(),
                    bodyText: (await page.locator('body').innerText()).slice(0, 5000),
                    consoleErrors: [...consoleErrors],
                    pageErrors: [...pageErrors],
                    horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth),
                  });
                } else {
                  report.push({ route: 'recipe', viewport: viewport.name, skipped: 'No recipe link found on /food' });
                }
              } catch (error) {
                report.push({ route: 'recipe', viewport: viewport.name, error: String(error), url: page.url() });
              }
              await context.close();
            }
          } catch (error) {
            report.push({ route: 'browser', error: String(error) });
          } finally {
            if (browser) await browser.close().catch(() => {});
            fs.writeFileSync(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          }
          NODE
      - name: Show audit files
        if: always()
        run: find public/visual-audit-pr124 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr124-visual-audit
          path: src/frontend/public/visual-audit-pr124
          if-no-files-found: error
