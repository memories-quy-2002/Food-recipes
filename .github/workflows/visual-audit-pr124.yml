name: Visual audit PR 124

on:
  push:
    branches:
      - refactor/frontend-tailwind-shadcn
    paths:
      - .github/workflows/visual-audit-pr124.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: corepack enable
      - run: corepack pnpm@11.18.0 install --frozen-lockfile
      - run: corepack pnpm@11.18.0 exec playwright install --with-deps chromium
      - name: Capture responsive screenshots and migration inventory
        env:
          BASE_URL: https://food-recipes-awlm2n4ny-memories-projects-2002.vercel.app
          ENTRY_URL: https://food-recipes-awlm2n4ny-memories-projects-2002.vercel.app/?_vercel_share=t5a1BbnVIwlIXAea8oY5FwfTAESuUVQH
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const path = require('node:path');

          const baseUrl = process.env.BASE_URL;
          const entryUrl = process.env.ENTRY_URL;
          const outputDir = path.join('public', 'visual-audit-pr124');
          const viewports = [
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'desktop-1080', width: 1920, height: 1080 },
            { name: 'desktop-1440', width: 2560, height: 1440 },
          ];
          const routes = [
            { name: 'home', path: '/' },
            { name: 'account-login', path: '/account?signup=false' },
            { name: 'account-signup', path: '/account?signup=true' },
            { name: 'food', path: '/food' },
          ];

          const scanExtensions = new Set(['.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html']);
          const migration = { legacyUiImports: [], styleImports: [], bootstrapReferences: [] };
          function scan(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', 'dist', 'public', '.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { scan(full); continue; }
              if (!scanExtensions.has(path.extname(entry.name))) continue;
              const source = fs.readFileSync(full, 'utf8');
              const relative = path.relative(process.cwd(), full);
              if (source.includes('@/shared/ui/legacy-ui')) migration.legacyUiImports.push(relative);
              if (/import\s+["'][^"']+\.(?:scss|css)["']/.test(source) && !relative.endsWith('app/index.css')) migration.styleImports.push(relative);
              if (/bootstrap/i.test(source)) migration.bootstrapReferences.push(relative);
            }
          }
          scan(process.cwd());

          fs.rmSync(outputDir, { recursive: true, force: true });
          fs.mkdirSync(outputDir, { recursive: true });
          const browser = await chromium.launch();
          const report = [];

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', (msg) => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', (err) => pageErrors.push(err.message));

            await page.goto(entryUrl, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(500);

            for (const route of routes) {
              const response = await page.goto(`${baseUrl}${route.path}`, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(1200);
              const file = `${route.name}-${viewport.name}.png`;
              await page.screenshot({ path: path.join(outputDir, file), fullPage: true });
              report.push({
                route: route.name,
                viewport: viewport.name,
                url: page.url(),
                status: response?.status(),
                title: await page.title(),
                bodyText: (await page.locator('body').innerText()).slice(0, 4000),
                consoleErrors: [...consoleErrors],
                pageErrors: [...pageErrors],
                horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth),
              });
              consoleErrors.length = 0;
              pageErrors.length = 0;
            }

            await page.goto(`${baseUrl}/food`, { waitUntil: 'networkidle', timeout: 60000 });
            const recipeHref = await page.locator('a[href*="/recipe?id="]').first().getAttribute('href').catch(() => null);
            if (recipeHref) {
              const response = await page.goto(new URL(recipeHref, baseUrl).toString(), { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(1200);
              const file = `recipe-${viewport.name}.png`;
              await page.screenshot({ path: path.join(outputDir, file), fullPage: true });
              report.push({
                route: 'recipe',
                viewport: viewport.name,
                url: page.url(),
                status: response?.status(),
                title: await page.title(),
                bodyText: (await page.locator('body').innerText()).slice(0, 4000),
                consoleErrors: [...consoleErrors],
                pageErrors: [...pageErrors],
                horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth),
              });
            } else {
              report.push({ route: 'recipe', viewport: viewport.name, skipped: 'No recipe link found on /food' });
            }

            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(outputDir, 'migration-inventory.json'), JSON.stringify(migration, null, 2));
          NODE
      - name: Commit audit captures
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/public/visual-audit-pr124
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m 'test(frontend): publish temporary visual audit captures'
          git push
