name: Temporary Security Lockfile Refresh

on:
  push:
    branches:
      - fix/codeql-security-quality

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Refresh backend lockfile
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml

      - name: Refresh backend lockfile
        working-directory: src/backend
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore(security): refresh backend lockfile"
          git push
