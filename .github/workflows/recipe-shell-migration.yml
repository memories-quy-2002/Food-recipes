name: One-time recipe shell migration
on:
  push:
    branches: [refactor/frontend-tailwind-shadcn]
    paths: [.github/workflows/recipe-shell-migration.yml]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate recipe shell
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/frontend/features/recipes/Recipe.jsx';
          let s = fs.readFileSync(file, 'utf8');
          s = s.replace('import { Container } from "@/shared/ui/legacy-ui";\n', '');
          s = s.replace('import "./Recipe.scss";\n', '');
          s = s.replace('<Container as="main" fluid className="fr-recipe" style={{ padding: 0 }}>', '<main className="min-h-screen bg-background text-foreground">');
          s = s.replace('</Container>', '</main>');
          if (s.includes('@/shared/ui/legacy-ui') || s.includes('Recipe.scss') || s.includes('<Container') || s.includes('</Container>')) {
            throw new Error('Recipe shell migration incomplete');
          }
          fs.writeFileSync(file, s);
          for (const path of [
            'src/frontend/features/recipes/Recipe.scss',
            'src/frontend/features/recipes/RecipeMetadataPanel.scss',
          ]) {
            if (fs.existsSync(path)) fs.unlinkSync(path);
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/features/recipes
          git commit -m 'refactor(recipe): remove legacy recipe shell styles'
          git push
