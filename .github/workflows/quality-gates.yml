name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  install:
    name: Validate repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Node runtime
        run: node --version

  static:
    name: Static validators
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DB-free static validators
        run: |
          node src/backend/test/ci-workflow.validation.mjs
          node src/backend/test/prisma-baseline.validation.mjs
          node src/backend/test/recipe-duration-migration.validation.mjs
          node src/backend/test/docker-infrastructure.validation.mjs
          node src/backend/test/backend-product-security.validation.mjs

  prisma:
    name: Prisma validate and generate
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile
      - name: Validate and generate Prisma Client offline
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma validate --config prisma.ci.config.ts
          pnpm exec prisma generate --config prisma.ci.config.ts

  api-quality:
    name: API typecheck and unit tests
    needs: prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client offline
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma generate --config prisma.ci.config.ts
      - name: Typecheck API
        working-directory: src/backend
        run: pnpm typecheck
      - name: Run API unit tests
        working-directory: src/backend
        run: pnpm test
      - name: Audit backend dependencies
        working-directory: src/backend
        # Prisma 7.9.1 currently pins deepmerge-ts 7.x; keep this upstream
        # tooling advisory explicit until Prisma publishes a patched pin.
        run: pnpm audit --audit-level high --ignore GHSA-ggr8-5vv4-36mx

  contract-e2e:
    name: API contract E2E
    needs: api-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client offline
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma generate --config prisma.ci.config.ts
      - name: Run API contract E2E tests
        working-directory: src/backend
        run: pnpm test:e2e

  frontend:
    name: Frontend build
    needs: contract-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: src/frontend
        run: pnpm typecheck
      - name: Run frontend unit tests
        working-directory: src/frontend
        run: pnpm test:ci
      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build

  frontend-e2e:
    name: Frontend Playwright E2E
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: src/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run frontend Playwright E2E
        working-directory: src/frontend
        run: pnpm test:e2e:ci

  docker-runtime-build:
    name: Docker runtime build
    needs: frontend-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime image
        run: docker build --target runtime --tag food-recipes-api:ci --file src/backend/Dockerfile src/backend

  migration-release-handoff:
    name: One-shot migration gate / release handoff
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-runtime-build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile
      - name: Run one-shot Prisma migration gate
        working-directory: src/backend
        run: pnpm exec prisma migrate deploy --config prisma.config.ts
