name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

  static:
    name: Static validators
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run DB-free static validators
        run: |
          node src/backend/apps/api/test/ci-workflow.validation.mjs
          node src/backend/apps/api/test/prisma-baseline.validation.mjs
          node src/backend/apps/api/test/recipe-duration-migration.validation.mjs
          node src/backend/apps/api/test/docker-infrastructure.validation.mjs

  prisma:
    name: Prisma validate and generate
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and generate Prisma Client offline
        working-directory: src/backend/apps/api
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma validate --config prisma.ci.config.ts
          pnpm exec prisma generate --config prisma.ci.config.ts

  api-quality:
    name: API typecheck and unit tests
    needs: prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client offline
        working-directory: src/backend/apps/api
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma generate --config prisma.ci.config.ts
      - name: Typecheck API
        run: pnpm --filter @food-recipes/api exec tsc -p tsconfig.build.json --noEmit
      - name: Run API unit tests
        run: pnpm --filter @food-recipes/api test

  contract-e2e:
    name: API contract E2E
    needs: api-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client offline
        working-directory: src/backend/apps/api
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f prisma.ci.config.ts' EXIT
          cat > prisma.ci.config.ts <<'EOF'
          import { defineConfig } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: 'postgresql://127.0.0.1:1/ci_validation' },
          });
          EOF
          pnpm exec prisma generate --config prisma.ci.config.ts
      - name: Run API contract E2E tests
        run: pnpm --filter @food-recipes/api test:e2e

  frontend:
    name: Frontend build
    needs: contract-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build

  docker-runtime-build:
    name: Docker runtime build
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime image
        run: docker build --target runtime --tag food-recipes-api:ci --file src/backend/apps/api/Dockerfile .

  migration-release-handoff:
    name: One-shot migration gate / release handoff
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-runtime-build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run one-shot Prisma migration gate
        working-directory: src/backend/apps/api
        run: pnpm exec prisma migrate deploy --config prisma.config.ts
