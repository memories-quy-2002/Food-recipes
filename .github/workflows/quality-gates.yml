name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run repository validators
        run: |
          node src/backend/test/ci-workflow.validation.mjs
          node src/backend/test/prisma-baseline.validation.mjs
          node src/backend/test/recipe-duration-migration.validation.mjs
          node src/backend/test/docker-infrastructure.validation.mjs
          node src/backend/test/backend-product-security.validation.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        working-directory: src/backend
        run: pnpm prisma:validate

      - name: Generate Prisma client
        working-directory: src/backend
        run: pnpm prisma:generate

      - name: Run backend checks
        working-directory: src/backend
        run: pnpm check

      - name: Run API contract E2E tests
        working-directory: src/backend
        run: pnpm test:e2e

      - name: Build API
        working-directory: src/backend
        run: pnpm build

      - name: Build production API image
        run: docker build --target runtime --tag food-recipes-api:ci --file src/backend/Dockerfile src/backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        working-directory: src/frontend
        run: pnpm check

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build

      - name: Install Chromium
        working-directory: src/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend Playwright journeys
        working-directory: src/frontend
        run: pnpm test:e2e:ci

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            src/frontend/test-results
            src/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
