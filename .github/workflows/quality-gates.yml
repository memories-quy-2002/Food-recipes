name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      cross: ${{ steps.filter.outputs.cross }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect affected packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
            backend:
              - 'src/backend/**'
            cross:
              - '.github/**'
              - '.husky/**'
              - 'AGENTS.md'

  static:
    name: Static validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run repository validators
        run: |
          node src/backend/test/ci-workflow.validation.mjs
          node src/backend/test/prisma-baseline.validation.mjs
          node src/backend/test/recipe-duration-migration.validation.mjs
          node src/backend/test/user-food-preferences-migration.validation.mjs
          node src/backend/test/docker-infrastructure.validation.mjs
          node src/backend/test/backend-product-security.validation.mjs
          node src/backend/test/production-demo-reset.validation.mjs

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.cross == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        working-directory: src/backend
        run: pnpm prisma:validate

      - name: Generate Prisma client
        working-directory: src/backend
        run: pnpm prisma:generate

      - name: Run backend checks
        working-directory: src/backend
        run: pnpm check

      - name: Run API contract E2E tests
        working-directory: src/backend
        run: pnpm test:e2e

      - name: Build API
        working-directory: src/backend
        run: pnpm build

      - name: Build production API image
        run: docker build --target runtime --tag food-recipes-api:ci --file src/backend/Dockerfile src/backend

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cross == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        working-directory: src/frontend
        run: pnpm check

      - name: Build frontend
        working-directory: src/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000
        run: pnpm build

  frontend-e2e:
    name: Frontend quality E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cross == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend for preview
        working-directory: src/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000
        run: pnpm build

      - name: Install Playwright browser
        working-directory: src/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend quality journeys
        working-directory: src/frontend
        run: pnpm test:e2e:quality

      - name: Upload frontend browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-artifacts
          if-no-files-found: ignore
          path: |
            src/frontend/test-results
            src/frontend/playwright-report
            src/frontend/output

  real-stack:
    name: Real-stack acceptance and security
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.cross == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: food_recipes
          POSTGRES_PASSWORD: food_recipes
          POSTGRES_DB: food_recipes_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_recipes -d food_recipes_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            src/backend/pnpm-lock.yaml
            src/frontend/pnpm-lock.yaml

      - name: Install locked backend dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile

      - name: Install locked frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: src/backend
        run: pnpm prisma:generate

      - name: Generate an ephemeral CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply migrations to the ephemeral database
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql://food_recipes:food_recipes@127.0.0.1:5432/food_recipes_e2e
        run: pnpm exec prisma migrate deploy --config prisma.config.ts

      - name: Seed the ephemeral database
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql://food_recipes:food_recipes@127.0.0.1:5432/food_recipes_e2e
        run: pnpm prisma:seed

      - name: Start the API
        working-directory: src/backend
        env:
          NODE_ENV: development
          PORT: 3000
          DATABASE_URL: postgresql://food_recipes:food_recipes@127.0.0.1:5432/food_recipes_e2e
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          AUTH_PUBLIC_WEB_URL: http://localhost:5173
        run: |
          pnpm start:dev > "$RUNNER_TEMP/food-recipes-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/food-recipes-api.pid"

      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/food-recipes-api.log"
          exit 1

      - name: Build frontend for real-stack preview
        working-directory: src/frontend
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: pnpm build

      - name: Install Playwright browser
        working-directory: src/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-stack acceptance and security journeys
        working-directory: src/frontend
        env:
          FOOD_RECIPES_E2E_API_URL: http://localhost:3000/api/v1
          FOOD_RECIPES_E2E_API_ORIGIN: http://localhost:3000
          FOOD_RECIPES_E2E_WEB_URL: http://localhost:5173
        run: pnpm test:e2e:real

      - name: Capture API log
        if: always()
        run: cp "$RUNNER_TEMP/food-recipes-api.log" real-stack-api.log || true

      - name: Upload real-stack artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-playwright-artifacts
          if-no-files-found: ignore
          path: |
            src/frontend/test-results
            src/frontend/playwright-report
            src/frontend/output
            real-stack-api.log
