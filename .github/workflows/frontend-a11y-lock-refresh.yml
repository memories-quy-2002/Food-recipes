name: Frontend a11y lock refresh

on:
  push:
    branches:
      - fix/frontend-accessibility-foundation

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): add axe playwright') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-accessibility-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: Generate axe dependency lockfile
        working-directory: src/frontend
        run: pnpm add --save-dev --lockfile-only @axe-core/playwright@4.13.0
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/package.json src/frontend/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): add axe playwright"
          git push origin HEAD:fix/frontend-accessibility-foundation
