name: One-time frontend migration inventory
on:
  push:
    branches: [refactor/frontend-tailwind-shadcn]
    paths: [.github/workflows/frontend-migration-inventory.yml]
permissions:
  contents: write
jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory legacy UI and style imports
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'src/frontend';
          const rows = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules','dist','public','.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(full); continue; }
              if (!/\.(jsx?|tsx?|css|scss|html)$/.test(entry.name)) continue;
              const s = fs.readFileSync(full, 'utf8');
              const rel = full.replaceAll('\\','/');
              if (s.includes('@/shared/ui/legacy-ui')) rows.push(`LEGACY_UI ${rel}`);
              for (const match of s.matchAll(/import\s+["']([^"']+\.(?:scss|css))["']/g)) {
                if (rel !== 'src/frontend/app/index.css') rows.push(`STYLE_IMPORT ${rel} -> ${match[1]}`);
              }
              if (/bootstrap/i.test(s) && !rel.includes('no-bootstrap.test')) rows.push(`BOOTSTRAP_REF ${rel}`);
            }
          }
          walk(root);
          fs.writeFileSync('frontend-migration-inventory.txt', rows.sort().join('\n') + (rows.length ? '\n' : 'CLEAN\n'));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-migration-inventory.txt
          git commit -m 'chore(ui): publish migration inventory'
          git push
