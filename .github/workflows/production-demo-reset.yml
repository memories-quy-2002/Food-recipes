name: Production Demo Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET_FOOD_RECIPES_PRODUCTION to confirm the destructive reset
        required: true
        type: string
      backup_confirm:
        description: Type BACKUP_VERIFIED after confirming a recoverable backup/PITR point
        required: true
        type: string
      backup_reference:
        description: Backup ID or PITR recovery point verified before this reset
        required: true
        type: string
      project_ref:
        description: Supabase project ref configured for the production demo environment
        required: true
        type: string
      clear_storage:
        description: Delete all objects from the configured recipe-images Storage bucket
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Validate CI and manual confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the master branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Production demo reset must be dispatched from master." >&2
            exit 1
          fi

      - name: Validate manual confirmation inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          BACKUP_CONFIRM: ${{ inputs.backup_confirm }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RESET_FOOD_RECIPES_PRODUCTION"
          test "$BACKUP_CONFIRM" = "BACKUP_VERIFIED"
          if [[ -z "$(printf '%s' "$BACKUP_REFERENCE" | tr -d '[:space:]')" ]]; then
            echo "A verified backup or PITR reference is required." >&2
            exit 1
          fi
          if [[ -z "$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]')" ]]; then
            echo "The production project ref is required." >&2
            exit 1
          fi

      - name: Require successful Quality Gates on this master commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(gh run list \
            --workflow quality-gates.yml \
            --branch master \
            --commit "$GITHUB_SHA" \
            --event workflow_dispatch \
            --limit 100 \
            --json event,status,conclusion,createdAt \
            --jq '[.[] | select(.event == "workflow_dispatch")] | sort_by(.createdAt) | last | if . != null and .status == "completed" and .conclusion == "success" then 1 else 0 end')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful manually dispatched full Quality Gates run found for $GITHUB_SHA on master." >&2
            exit 1
          fi

  reset-production-demo:
    name: Reset and seed production demo
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-demo-reset
    concurrency:
      group: food-recipes-production-database
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/backend/pnpm-lock.yaml

      - name: Install locked backend dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: src/backend
        run: pnpm prisma:generate

      - name: Validate reset and production database configuration before migrations
        working-directory: src/backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DEMO_RESET_ENABLED: ${{ secrets.PRODUCTION_DEMO_RESET_ENABLED }}
          PRODUCTION_DEMO_PROJECT_REF: ${{ secrets.PRODUCTION_DEMO_PROJECT_REF }}
          PRODUCTION_DEMO_DB_HOST: ${{ secrets.PRODUCTION_DEMO_DB_HOST }}
          DEMO_RESET_PROJECT_REF: ${{ inputs.project_ref }}
          DEMO_RESET_CONFIRM: ${{ inputs.confirm }}
          DEMO_RESET_BACKUP_CONFIRMED: ${{ inputs.backup_confirm }}
          DEMO_RESET_BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          DEMO_RESET_STORAGE: ${{ inputs.clear_storage }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_RECIPE_BUCKET: ${{ secrets.SUPABASE_RECIPE_BUCKET }}
        run: pnpm demo:reset:validate

      - name: Deploy pending production migrations
        working-directory: src/backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Reset application data, seed demo data, and clear Storage when selected
        working-directory: src/backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DEMO_RESET_ENABLED: ${{ secrets.PRODUCTION_DEMO_RESET_ENABLED }}
          PRODUCTION_DEMO_PROJECT_REF: ${{ secrets.PRODUCTION_DEMO_PROJECT_REF }}
          PRODUCTION_DEMO_DB_HOST: ${{ secrets.PRODUCTION_DEMO_DB_HOST }}
          DEMO_RESET_PROJECT_REF: ${{ inputs.project_ref }}
          DEMO_RESET_CONFIRM: ${{ inputs.confirm }}
          DEMO_RESET_BACKUP_CONFIRMED: ${{ inputs.backup_confirm }}
          DEMO_RESET_BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          DEMO_RESET_STORAGE: ${{ inputs.clear_storage }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_RECIPE_BUCKET: ${{ secrets.SUPABASE_RECIPE_BUCKET }}
        run: pnpm demo:reset:production

      - name: Verify demo graph
        working-directory: src/backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm demo:verify
