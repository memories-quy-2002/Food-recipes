version: 2

updates:
  # Keep application dependency maintenance consolidated across the frontend
  # and backend. Minor/patch updates are grouped into one routine PR.
  # NestJS 12 majors are deferred until a coordinated backend migration.
  - package-ecosystem: "npm"
    directories:
      - "/src/frontend"
      - "/src/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"

    # Limit routine version update noise to one grouped PR.
    open-pull-requests-limit: 1

    versioning-strategy: "increase-if-necessary"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    labels:
      - "dependencies"

    # Let routine releases settle before adopting them. Security updates are
    # handled separately and are not intentionally delayed by this policy.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

    # Routine version updates are limited to patch/minor releases.
    # Major version upgrades require an explicit, separately tested migration.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

    groups:
      routine-npm-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "class-validator"
        update-types:
          - "patch"
          - "minor"

      security-npm-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  # GitHub Actions are a separate ecosystem, so keep them in one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Ho_Chi_Minh"

    open-pull-requests-limit: 1

    commit-message:
      prefix: "chore(ci)"
      include: "scope"

    labels:
      - "dependencies"

    groups:
      github-actions:
        patterns:
          - "*"
