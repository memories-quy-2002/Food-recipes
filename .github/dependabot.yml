version: 2

updates:
  # Keep application dependency maintenance consolidated across the frontend
  # and backend. Minor/patch updates are grouped into one routine PR.
  #
  # The three explicit NestJS packages are temporary exceptions so the
  # currently-open NestJS 12 PRs remain valid. Once that migration is handled,
  # remove those exceptions and reduce open-pull-requests-limit to 1.
  - package-ecosystem: "npm"
    directories:
      - "/src/frontend"
      - "/src/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"

    # Temporary: 3 existing NestJS 12 PRs + 1 grouped routine dependency PR.
    # After the NestJS 12 migration is resolved, set this to 1.
    open-pull-requests-limit: 4

    versioning-strategy: "increase-if-necessary"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    labels:
      - "dependencies"

    # Let routine releases settle before adopting them. Security updates are
    # handled separately and are not intentionally delayed by this policy.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

    # Routine version updates are limited to patch/minor releases. The three
    # NestJS packages stay explicitly allowed so their existing v12 PRs remain
    # open while the migration is evaluated as a unit.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "@nestjs/config"
      - dependency-name: "@nestjs/jwt"
      - dependency-name: "@nestjs/passport"

    groups:
      routine-npm-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "class-validator"
        update-types:
          - "patch"
          - "minor"

      security-npm-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  # GitHub Actions are a separate ecosystem, so keep them in one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Ho_Chi_Minh"

    open-pull-requests-limit: 1

    commit-message:
      prefix: "chore(ci)"
      include: "scope"

    labels:
      - "dependencies"

    groups:
      github-actions:
        patterns:
          - "*"
